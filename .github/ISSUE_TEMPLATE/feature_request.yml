name: 🚀 Feature Request
description: Suggest an idea, enhancement, or optimization for this project.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make this tool faster, more robust, or easier to use? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is (e.g., "Data processing is too slow when handling large matrices...").
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of what you want to happen, including any expected behavior or syntax improvements.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions, current workarounds, or features in other tools you've looked at.