name: 🐛 Bug Report
description: File a report to help us identify and fix a bug.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example (reprex)
      description: Please provide a code snippet, script layout, or small sample input dataset that reproduces the problem.
      placeholder: |
        ```r
        # Example R script demonstrating the issue
        ```
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Operating System, software versions (Python, R, Air version, Conda/Snakemake configurations if applicable).
      placeholder: |
        - OS: macOS Sequoia / Ubuntu 24.04
        - R Version: 4.4.1
        - Python Version: 3.12
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Sanity Check
      options:
        - label: I have searched existing issues to ensure this bug hasn't been reported yet.
          required: true